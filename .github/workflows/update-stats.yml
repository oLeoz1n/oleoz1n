name: Update profile stats

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        env:
          # PAT with `repo` scope so private contributions are counted.
          # Falls back to GITHUB_TOKEN (public data only) if the secret is absent.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: node scripts/generate-stats.mjs --user oleoz1n --out assets

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats cards"
          git push
